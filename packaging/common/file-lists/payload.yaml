# Shared installed-file inventory for every GlifiStore packaging backend.
#
# Authority for what a package must deliver, grouped into the components that the
# Debian and RPM backends map onto binary packages. Verifier:
# engineering/tools/verify_package_payload.py, which resolves the @TOKEN@
# placeholders from the backend layout and refuses an unknown token.
#
# This file is not a substitute for the native payload databases: the BSD reference
# ports keep pkg-plist / PLIST as their own authority and are not checked against
# this inventory yet (Wave D).
#
# entry kinds:
#   file            - a regular file must exist
#   executable      - a regular file with at least one execute bit
#   shared_library  - a regular file; ELF/Mach-O content is proven by package-inspect
#   directory       - a directory must exist
#   glob            - at least one path must match (compression and CMake config
#                     suffixes are decided by the distribution, not by us)
version: 1

tokens:
  - bindir
  - libdir
  - includedir
  - datadir
  - mandir
  - sysconfdir
  - unitdir
  - statedir
  - abi_major
  - abi_version

components:
  - id: runtime
    description: daemon and operator tools
    entries:
      - path: "@bindir@/glifistored"
        kind: executable
      - path: "@bindir@/glifistore_backup_store"
        kind: executable
      - path: "@bindir@/glifistore_demo"
        kind: executable
      - path: "@bindir@/glifistore_inspect_segment"
        kind: executable
      - path: "@bindir@/glifistore_migrate_store"
        kind: executable
      - path: "@bindir@/glifistore_rebuild_index"
        kind: executable
      - path: "@bindir@/glifistore_repair_store"
        kind: executable
      - path: "@bindir@/glifistore_verify_store"
        kind: executable
      - path: "@datadir@/GlifiStore/VERSION"
        kind: file
      - path: "@datadir@/GlifiStore/ABI_VERSION"
        kind: file
      - path: "@datadir@/GlifiStore/LICENSE"
        kind: file
      - path: "@datadir@/GlifiStore/NOTICE"
        kind: file
      - path: "@datadir@/GlifiStore/THIRD_PARTY_NOTICES.md"
        kind: file
      - path: "@datadir@/GlifiStore/examples/glifistored.conf.sample"
        kind: file

  - id: library
    description: C ABI shared library, versioned by ABI_VERSION
    entries:
      - path: "@libdir@/libglifistore.so.@abi_major@"
        kind: shared_library
      - path: "@libdir@/libglifistore.so.@abi_version@"
        kind: shared_library

  - id: development
    description: headers, static libraries, pkg-config and CMake package files
    entries:
      - path: "@libdir@/libglifistore.so"
        kind: file
      - path: "@libdir@/libglifistore_client.a"
        kind: file
      - path: "@libdir@/libglifistore_core.a"
        kind: file
      - path: "@libdir@/libglifistore_tls_layer.a"
        kind: file
      - path: "@libdir@/libglifistore_wire.a"
        kind: file
      - path: "@libdir@/pkgconfig/glifistore-abi.pc"
        kind: file
      - path: "@libdir@/cmake/GlifiStore/GlifiStoreConfig.cmake"
        kind: file
      - path: "@libdir@/cmake/GlifiStore/GlifiStoreConfigVersion.cmake"
        kind: file
      - path: "@libdir@/cmake/GlifiStore/GlifiStoreTargets.cmake"
        kind: file
      - path: "@libdir@/cmake/GlifiStore/FindGlifiStoreTls.cmake"
        kind: file
      - path: "@libdir@/cmake/GlifiStore/GlifiStoreTargets-*.cmake"
        kind: glob
      - path: "@includedir@/glifistore/abi/glifistore.h"
        kind: file
      - path: "@includedir@/glifistore/client/client.hpp"
        kind: file
      - path: "@includedir@/glifistore/core/error.hpp"
        kind: file
      - path: "@includedir@/glifistore/core/types.hpp"
        kind: file
      - path: "@includedir@/glifistore/core/worker_routing.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/compaction_intent.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/filesystem.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/filesystem_hooks.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/manifest.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/namespace_audit.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/resource_limits.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/store_backup.hpp"
        kind: file
      - path: "@includedir@/glifistore/persistence/store_verify.hpp"
        kind: file
      - path: "@includedir@/glifistore/segment/segment_header.hpp"
        kind: file
      - path: "@includedir@/glifistore/server/protocol.hpp"
        kind: file
      - path: "@includedir@/glifistore/store/config.hpp"
        kind: file
      - path: "@includedir@/glifistore/store/maintenance_types.hpp"
        kind: file
      - path: "@includedir@/glifistore/store/store.hpp"
        kind: file
      - path: "@includedir@/glifistore/store/value.hpp"
        kind: file

  - id: documentation
    description: mdoc manuals; the distribution decides whether to compress them
    entries:
      - path: "@mandir@/man8/glifistored.8*"
        kind: glob
      - path: "@mandir@/man7/glifistore.7*"
        kind: glob
      - path: "@mandir@/man1/glifistore_backup_store.1*"
        kind: glob
      - path: "@mandir@/man1/glifistore_demo.1*"
        kind: glob
      - path: "@mandir@/man1/glifistore_inspect_segment.1*"
        kind: glob
      - path: "@mandir@/man1/glifistore_migrate_store.1*"
        kind: glob
      - path: "@mandir@/man1/glifistore_rebuild_index.1*"
        kind: glob
      - path: "@mandir@/man1/glifistore_repair_store.1*"
        kind: glob
      - path: "@mandir@/man1/glifistore_verify_store.1*"
        kind: glob

  - id: configuration
    description: operator-owned configuration; preserved by upgrade and remove
    entries:
      - path: "@sysconfdir@/glifistore/glifistored.conf"
        kind: file

  - id: service
    description: systemd unit installed by the Linux backends
    entries:
      - path: "@unitdir@/glifistored.service"
        kind: file

  - id: data
    description: durable Store directory; never removed by a package action
    entries:
      - path: "@statedir@"
        kind: directory
