name: OpenBSD LibreSSL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbsd-libressl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openbsd-libressl:
    name: OpenBSD / LibreSSL TLS gate (${{ matrix.shard_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_label: 1-of-2
            skip_go_smoke: "0"
          - shard_index: 1
            shard_label: 2-of-2
            skip_go_smoke: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and test on OpenBSD with system LibreSSL
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1
        with:
          release: "7.9"
          arch: x86_64
          usesh: true
          copyback: true
          sync: rsync
          mem: 8192
          cache-after-prepare: true
          prepare: |
            pkg_add -I cmake ninja git go bash pkgconf
          run: |
            set -e
            mkdir -p engineering/evidence/native-ci
            chmod +x scripts/ci-openbsd-libressl.sh
            export GLYPHASTORE_TEST_SHARD_COUNT=2
            export GLYPHASTORE_TEST_SHARD_INDEX=${{ matrix.shard_index }}
            export GLYPHASTORE_SKIP_GO_SMOKE=${{ matrix.skip_go_smoke }}
            bash -o pipefail -c \
              'bash scripts/ci-openbsd-libressl.sh 2>&1 | tee engineering/evidence/native-ci/openbsd-${{ matrix.shard_label }}.log'
            rm -rf build sdk/go/bin
      - name: Retain native OpenBSD log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openbsd-native-${{ github.sha }}-${{ matrix.shard_label }}
          path: engineering/evidence/native-ci/openbsd-${{ matrix.shard_label }}.log
          if-no-files-found: error
          retention-days: 14
