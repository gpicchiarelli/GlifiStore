- id: GS-RELEASE-ARTIFACT-001
  titolo: Build-once artifact identity verification and immutable promotion
  categoria: compatibility
  criticita: alta
  stato: implementato
  descrizione: Le release partono esclusivamente da un tag annotato coerente con VERSION, costruiscono
    il candidate una sola volta, ammettono l'insieme esatto mediante seal SHA-256, importano package
    ed evidence in un inventario chiuso, verificano package consumer, SBOM, compatibility evidence e
    provenance, quindi pubblicano senza rebuild o sostituzione asset.
  autorita:
  - docs/adr/0038-stable-c-abi-artifact-delivery.md
  - docs/distribution/artifact-delivery.md
  - docs/distribution/bsd-packaging.md
  implementazione:
