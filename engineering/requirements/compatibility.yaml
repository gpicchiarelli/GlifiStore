  - scripts/test-freebsd-package-lifecycle.sh
  - packaging/freebsd
  - packaging/openbsd
  prove:
  - scripts/tests/test_release_artifacts.py
  - scripts/tests/test_bsd_packaging.py
  - scripts/tests/test_artifact_release_workflow.py
  piattaforme:
  - linux-x86_64
  - freebsd
  - openbsd
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: release.yml
    note: I producer same-run SDK, persistenza, ABI, wire, security matrix, package FreeBSD/OpenBSD e riproducibilita esistono con gate negativi; nessuna release completa e stata ancora promossa
  rischio_residuo:
  - Nessun tag annotato e nessun package BSD nativo esistono ancora
  - Il vecchio consumer ABI e le otto evidenze release-wide potranno nascere solo dalla prima release
  - Il reusable workflow e locale al repository e non costituisce oggi prova SLSA Build Level 3
  - Persistenza, SDK, ABI, wire, security matrix, package FreeBSD/OpenBSD e riproducibilita hanno producer same-run (release.yml); i producer package BSD restano bloccati da account ports non registrato e dall'assenza di retention nativa taggata
  - Il producer FreeBSD resta bloccato finche l'account glyphastore non e registrato nel ports tree nativo
  - Il producer persistente resta bloccato finche non esiste un vero Store di una release taggata precedente
  - Il producer ABI resta bloccato finche non esiste una release completa attestata precedente
  - Il producer wire resta bloccato finche non esiste una release completa attestata precedente con client v2 sigillato
  hazards:
  - HAZ-030
  gates:
  - GATE-ARTIFACT-DELIVERY
  - GATE-RELEASE-MATRIX
  - GATE-REPRO-SBOM
- id: GS-RELEASE-PACKAGE-001
  titolo: Version-agnostic multi-backend package lifecycle with fail-closed evidence
  categoria: compatibility
  criticita: alta
  stato: implementato
  descrizione: >
    Ogni backend di packaging (deb, rpm, MacPorts, Homebrew, FreeBSD, OpenBSD) e dichiarato in
    un'unica matrice machine-readable che possiede target, profili CI, vocabolario dei check e
    limitazioni. Nessuna versione compare nella matrice o nei workflow: deriva da VERSION tramite
    il release context, con package revision separata. Ogni check riporta esattamente uno stato fra
    PASS, FAIL, NOT_RUN, NOT_APPLICABLE, NOT_APPLICABLE_INITIAL_BASELINE, BLOCKED e OPEN_GATE, il
    risultato del backend non puo essere migliore dei suoi check, e la categoria del check impedisce
    che una riga structural venga letta come prova package, service o upstream. I backend non gia
    richiesti da validate_release_policy restano required_for_release false. Windows e Apple .pkg
    sono rifiutati dal validatore della matrice, non semplicemente non implementati.
  autorita:
  - docs/distribution/package-ci.md
  - docs/distribution/package-status.md
  - docs/distribution/bsd-packaging.md
  - engineering/distribution/package-matrix.yaml
  implementazione:
  - engineering/distribution/package-matrix.yaml
  - engineering/schemas/package-evidence.schema.json
  - engineering/schemas/release-context.schema.json
  - engineering/tools/package_framework.py
  - engineering/tools/generate_release_context.py
  - engineering/tools/generate_package_matrix.py
  - engineering/tools/generate_package_status.py
  - engineering/tools/validate_package_evidence.py
  - engineering/tools/package_ci_plan.py
  - engineering/tools/render_package_metadata.py
  - engineering/tools/render_macos_packaging.py
  - engineering/tools/run_linux_package_backend.py
  - engineering/tools/run_macos_package_backend.py
  - engineering/tools/bsd_package_lifecycle.py
  - engineering/tools/verify_package_payload.py
  - scripts/package-ci.sh
  - scripts/lib/package-backend-linux.sh
  - scripts/lib/package-backend-macos.sh
  - scripts/lib/package-backend-bsd.sh
  - packaging/common
  - packaging/debian
  - packaging/rpm
  - packaging/macports
  - packaging/homebrew
  - packaging/freebsd
  - packaging/openbsd
  - .github/workflows/package-ci.yml
  prove:
  - scripts/tests/test_package_matrix.py
  - scripts/tests/test_package_ci.py
  - scripts/tests/test_package_ci_plan.py
  - scripts/tests/test_package_evidence.py
  - scripts/tests/test_package_status_docs.py
  - scripts/tests/test_package_workflows.py
  - scripts/tests/test_linux_packaging.py
  - scripts/tests/test_macos_packaging.py
  - scripts/tests/test_bsd_package_ci.py
  - scripts/tests/test_release_context.py
  - scripts/tests/test_semver_policy.py
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd
  - openbsd
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: package-ci.yml
    note: Il workflow trattiene plan, evidence e closure per profilo; il nightly ha trattenuto
      lifecycle deb/rpm a LIFECYCLE_VERIFIED con service-lifecycle PASS sotto systemd come PID 1
      (run 34662210614); overall resta NOT_RUN senza candidate sigillato
  - workflow: assurance.yml
    note: Le suite negative del framework e la freschezza di docs/distribution/package-status.md
      girano in unittest discover -s scripts/tests
  rischio_residuo:
  - Il lifecycle deb/rpm container ha LIFECYCLE_VERIFIED trattenuto; required_for_release resta
    false e overall NOT_RUN senza candidate sigillato
  - Il lifecycle nativo MacPorts/Homebrew non e mai stato eseguito in un run CI trattenuto
  - MacPorts dichiara startupitem unprivileged (user/group glyphastore) e Homebrew dichiara
    brew services; senza run nativo trattenuto service-lifecycle resta OPEN_GATE per entrambi
  - upstream-ports-acceptance resta OPEN_GATE per FreeBSD, OpenBSD, MacPorts e Homebrew; il
    packaging in-repo e la pipeline del progetto, non un'accettazione upstream
  - external-consumer contro il prefix installato e costruito dai native scripts BSD
    (`package-external-consumer.sh`); senza un run tag trattenuto il residual resta la retention
  - package-upgrade resta NOT_APPLICABLE_INITIAL_BASELINE finche non esiste un predecessore
    SemVer annotato; Linux, BSD e macOS eseguono install→seed→upgrade→verify quando
    GLYPHASTORE_N1_PACKAGE_DIR fornisce pacchetti/archivi sigillati (mai ricostruiti da HEAD);
    manca ancora un PASS trattenuto su N-1 pubblicato
  - deb, rpm, macports e homebrew restano required_for_release false finche un gate non li promuove
  hazards:
  - HAZ-030
  - HAZ-034
  gates:
  - GATE-PACKAGE-LIFECYCLE
- id: GS-RELEASE-UPGRADE-001
  titolo: SemVer-aware sealed N-1 package baseline and exact-artifact package admission
  categoria: compatibility
  criticita: alta
  stato: implementato
  descrizione: >
    La baseline di upgrade e la release precedente scelta per precedenza SemVer fra i tag annotati
    pubblicati, completi, sigillati e ABI-compatibili, mai "versione corrente meno uno": una release
    draft, prerelease o priva di manifest non puo diventare baseline. I tre stati pre-upgrade restano
    distinti (NOT_APPLICABLE_INITIAL_BASELINE quando nulla precede, BLOCKED quando qualcosa precede ma
    nessuna release e ammissibile, NOT_RUN quando la baseline esiste e il run non l'ha esercitata).
    Quando GLYPHASTORE_N1_PACKAGE_DIR fornisce i pacchetti sigillati del predecessore, Linux deb/rpm,
    FreeBSD/OpenBSD e MacPorts/Homebrew eseguono la camminata install→seed→upgrade→verify nel
    lifecycle nativo/container (macOS seleziona l'archivio sorgente sigillato
    GlyphaStore-<version>.tar.xz). L'ammissione lega il manifest degli artifact
    al digest dell'archivio sorgente sigillato e ogni evidence al SHA-256 dei byte esatti, cosi un
    pacchetto ricostruito fra verify e publish emerge come byte drift; N-1 non viene mai ricostruito
    da HEAD. Il report di ammissione registra i blocchi e non promuove alcun gate.
  autorita:
  - docs/distribution/package-ci.md
  - docs/distribution/artifact-delivery.md
  - docs/architecture/n-n1-compatibility.md
  implementazione:
  - engineering/tools/semver_policy.py
  - engineering/tools/prior_release.py
  - engineering/tools/upgrade_baseline.py
  - engineering/tools/n1_package_artifacts.py
  - engineering/tools/generate_artifact_manifest.py
  - engineering/tools/validate_package_admission.py
  - engineering/tools/run_package_admission.py
  - engineering/schemas/upgrade-baseline.schema.json
  - engineering/schemas/upgrade-baseline-admission.schema.json
  - engineering/schemas/package-admission.schema.json
  - engineering/schemas/artifact-manifest.schema.json
  - engineering/schemas/installed-sdk-matrix.schema.json
  prove:
  - scripts/tests/test_package_upgrade_baseline.py
  - scripts/tests/test_n1_package_artifacts.py
  - scripts/tests/test_package_admission.py
  - scripts/tests/test_package_admission_orchestrator.py
  - scripts/tests/test_artifact_manifest.py
  - scripts/tests/test_package_installed_sdk_matrix.py
  - scripts/tests/test_semver_policy.py
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - freebsd
  - openbsd
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: package-ci.yml
    note: Closure invoca run_package_admission.py quando e presente un candidate sigillato
  - workflow: release.yml
    note: Job package-admission lega release_evidence FreeBSD/OpenBSD al candidate sigillato
  rischio_residuo:
  - >-
    L'ammissione e collegata fail-closed per l'esecuzione dei tool e trattiene i blocker; la
    matrice cross-SDK package-installed ha PASS nightly trattenuti per deb/rpm
    (run 34666166603), ma admitted resta false finche package-upgrade non esercita un
    predecessore SemVer N-1 sigillato
  - FreeBSD/OpenBSD dichiarano package-upgrade nella matrice e corrono
    install→seed→upgrade→verify quando GLYPHASTORE_N1_PACKAGE_DIR fornisce `.pkg`/`.tgz`
    sigillati; senza quei byte restano NOT_RUN / NOT_APPLICABLE_INITIAL_BASELINE
  - Nessun tag annotato ha ancora trattenuto un'ammissione positiva
  - I backend selezionano il predecessore SemVer e restano NOT_RUN (o
    NOT_APPLICABLE_INITIAL_BASELINE) finche GLYPHASTORE_N1_PACKAGE_DIR non fornisce i
    pacchetti sigillati; Linux, BSD e macOS eseguono install→seed→upgrade→verify quando quei
    byte sono disponibili nel lifecycle nativo/container, ma senza un predecessore pubblicato
    non esiste ancora un PASS trattenuto
  hazards:
  - HAZ-030
  - HAZ-034
  gates:
  - GATE-PACKAGE-ADMISSION
