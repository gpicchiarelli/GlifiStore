- id: GS-COMPAT-NN1-001
  titolo: Machine-readable N↔N-1 compatibility matrix
  categoria: compatibility
  criticita: alta
  stato: implementato
  descrizione: Store-open, wire, and ABI N↔N-1 combinations are recorded as supported,
    supported_offline_only, intentionally_rejected, unsupported, or not_promised with a CI
    validator. A same-run artifact-only persistence producer selects only a complete, checksummed,
    strictly older tagged Store. The wire producer retains a compiled client per candidate and
    exercises new/new plus both N-1 directions against a complete attested prior release.
